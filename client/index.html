<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- maximum-scale/user-scalable=no lock out pinch-zoom entirely — this is an app-like single-
         screen game, not a document meant to be zoomed, and once a phone is zoomed in even
         slightly it can pan the enlarged page around in any direction, which no CSS overflow
         rule on the page content can prevent (that's a browser-viewport behavior, not a layout
         one). Settled 2026-08-24 after real-device testing on iPhone showed exactly this. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>TOURZ</title>
    <!-- Fonts (Quicksand, Cormorant Garamond) and confetti are bundled, not loaded from Google
         Fonts / jsDelivr (since 2026-10-18) — see src/main.jsx and src/confetti.js — so the app the
         service worker saves is complete and looks right when reopened with no signal. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
