<!DOCTYPE html>
<html>
<head>
  <title>Landmark Reader</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    /* Same look as poi-reader/index.html - see that file's header comment for why these
       colors/fonts are copied from client/src/index.css rather than shared. */
    :root {
      --stone: #f2ede1; --stone-raised: #fffdf8; --stone-line: #ddd2bd;
      --ink: #23201b; --ink-soft: #6b5f4f; --brass: #b8823a; --brass-deep: #93662a;
      --forest: #2f6b4f; --forest-tint: #dcece2; --brick: #b33f2e;
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Quicksand', system-ui, -apple-system, 'Segoe UI', sans-serif;
      margin: 0; background: var(--stone);
      background-image: radial-gradient(circle at 1px 1px, var(--stone-line) 1px, transparent 0);
      background-size: 22px 22px; color: var(--ink);
    }
    #app { max-width: 560px; margin: 0 auto; padding: 16px; padding-bottom: 90px; }
    .progress { font-size: 13px; color: var(--ink-soft); margin-bottom: 8px; }
    .bar { height: 4px; background: var(--stone-line); border-radius: 2px; overflow: hidden; margin-bottom: 16px; }
    .bar-fill { height: 100%; background: var(--brick); transition: width 0.2s; }
    .game-card {
      background: var(--forest-tint); border: 1px solid var(--stone-line); border-radius: 16px;
      box-shadow: 0 12px 32px rgba(20, 20, 20, 0.28); overflow: hidden; margin-bottom: 14px;
    }
    .game-card-image { flex: 0 0 auto; display: block; width: 100%; max-height: 200px; object-fit: cover; }
    .game-card-body { padding: 16px 20px 20px; }
    .game-card-body.no-image { padding-top: 20px; }
    .game-card-eyebrow {
      font-size: 13.5px; font-weight: 700; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--brass-deep); margin: 0 0 2px;
    }
    .game-card-body h3 { font-size: 17px; font-weight: 700; margin: 0 0 8px; }
    .game-card-body p { font-size: 14px; line-height: 1.45; color: var(--ink-soft); margin: 0 0 14px; }
    .game-card-body p:last-child { margin-bottom: 0; }
    .game-card-address { margin-top: -8px; }
    .game-card-field-label { font-size: 13.5px; font-weight: 700; color: var(--brass-deep); margin: 0 0 2px; }
    .no-image-placeholder {
      height: 90px; display: flex; align-items: center; justify-content: center;
      background: repeating-linear-gradient(45deg, #eadfca, #eadfca 10px, #e2d5bc 10px, #e2d5bc 20px);
      color: var(--ink-soft); font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em;
    }
    .meta-block { background: var(--stone-raised); border: 1px solid var(--stone-line); border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; font-size: 13.5px; }
    .gps-line { font-size: 14px; color: var(--ink); margin: 0 0 4px; }
    .placeholder-line { font-size: 12.5px; font-style: italic; color: var(--brick); margin: 0; }
    .nav-row { display: flex; gap: 10px; position: fixed; bottom: 0; left: 0; right: 0; background: var(--stone); padding: 12px 16px; border-top: 1px solid var(--stone-line); max-width: 560px; margin: 0 auto; }
    button { flex: 1; padding: 14px; border-radius: 8px; border: none; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; }
    .btn-secondary { background: var(--stone-raised); border: 1px solid var(--stone-line); color: var(--ink); }
    .btn-secondary:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primary { background: var(--brick); color: #fff; }
    .loading { text-align: center; padding-top: 60px; color: var(--ink-soft); }
  </style>
</head>
<body>
  <div id="app"><div class="loading">Loading landmarks.csv&hellip;</div></div>
  <div class="nav-row">
    <button class="btn-secondary" id="backBtn" onclick="goBack()">Back</button>
    <button class="btn-primary" id="nextBtn" onclick="goNext()">Next</button>
  </div>

  <script>
    // Read-only viewer for landmarks.csv - a sibling to poi-reader/index.html (which only
    // understands POI-candidates.csv's schema: single `description`, a `type` column, no
    // separate "about the landmark" vs "about the subject" split). Landmarks have a genuinely
    // different shape, so this is its own small page rather than shoehorning landmark rows into
    // the POI schema. Must be served via a local static server, same as poi-reader/index.html.
    const CSV_PATH = '../../db/content/edinburgh-tour/landmarks.csv';
    const IMAGE_BASE = '../../server/content-photos/';

    function parseCsv(text) {
      const rows = [];
      let row = [], field = '', inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (inQuotes) {
          if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else inQuotes = false; }
          else field += c;
        } else if (c === '"') { inQuotes = true; }
        else if (c === ',') { row.push(field); field = ''; }
        else if (c === '\n' || c === '\r') {
          if (c === '\r' && text[i + 1] === '\n') i++;
          row.push(field); field = '';
          if (row.length > 1 || row[0] !== '') rows.push(row);
          row = [];
        } else field += c;
      }
      if (field !== '' || row.length) { row.push(field); rows.push(row); }
      const header = rows.shift();
      return rows.map(r => { const obj = {}; header.forEach((h, i) => obj[h] = r[i] || ''); return obj; });
    }

    let landmarks = [];
    const pageLoadedAt = Date.now();
    let current = 0;

    fetch(CSV_PATH + '?_=' + Date.now())
      .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
      .then(text => { landmarks = parseCsv(text); render(); })
      .catch(err => {
        document.getElementById('app').innerHTML =
          '<div class="loading">Could not load landmarks.csv: ' + escapeHtml(err.message) +
          '<br><br>Must be served via a local static server (e.g. <code>npx serve</code> from the TOURZ project root), not opened directly as a file.</div>';
      });

    function isPlaceholder(str) { return /^PLACEHOLDER/i.test(str || ''); }

    function render() {
      if (landmarks.length === 0) { document.getElementById('app').innerHTML = '<div class="loading">No rows in landmarks.csv.</div>'; return; }
      const l = landmarks[current];
      const pct = Math.round(((current + 1) / landmarks.length) * 100);
      const displayNumber = Number(l.sequence_order) - 1;
      const displayLabel = displayNumber === 0 ? 'Starting landmark (not counted)' : ('Landmark ' + displayNumber);
      const image = l.image_path || l.hero_image_path;
      const hasImage = !!image;

      let html = '';
      html += `<div class="progress">Stored #${escapeHtml(l.sequence_order)} of ${landmarks.length} &middot; ${escapeHtml(displayLabel)}</div>`;
      html += `<div class="bar"><div class="bar-fill" style="width:${pct}%"></div></div>`;

      html += `<div class="game-card">`;
      if (hasImage) {
        html += `<img class="game-card-image" src="${escapeAttr(IMAGE_BASE + image)}?_=${pageLoadedAt}" onerror="this.outerHTML='<div class=&quot;no-image-placeholder&quot;>Image not found: ${escapeAttr(image)}</div>'">`;
      }
      html += `<div class="game-card-body${hasImage ? '' : ' no-image'}">`;
      html += `<div class="game-card-eyebrow">Landmark</div>`;
      html += `<h3>${escapeHtml(l.title)}</h3>`;
      if (l.address) html += `<p class="game-card-address">${escapeHtml(l.address)}</p>`;
      if (l.about_landmark_text) {
        html += `<p class="game-card-field-label">${escapeHtml(l.about_landmark_label || 'About this landmark')}</p>`;
        html += `<p>${escapeHtml(l.about_landmark_text)}</p>`;
      }
      if (l.about_subject_text) {
        html += `<p class="game-card-field-label">${escapeHtml(l.about_subject_label || 'About the subject')}</p>`;
        html += `<p>${escapeHtml(l.about_subject_text)}</p>`;
      }
      if (l.interesting_fact) html += `<p><strong>Interesting fact:</strong> ${escapeHtml(l.interesting_fact)}</p>`;
      if (!hasImage) html += `<div class="no-image-placeholder" style="margin-top:8px;border-radius:8px;">No image sourced yet</div>`;
      html += `</div></div>`;

      html += `<div class="meta-block">`;
      html += `<p class="gps-line">GPS: ${l.latitude && l.longitude ? escapeHtml(l.latitude) + ', ' + escapeHtml(l.longitude) : '<em>not set</em>'}</p>`;
      if (l.external_link) html += `<p class="gps-line" style="font-size:12.5px;word-break:break-all;">${escapeHtml(l.external_link)}</p>`;
      html += `</div>`;

      html += `<div class="meta-block">`;
      html += `<p class="game-card-field-label" style="margin-bottom:6px;">Clue / puzzle (gameplay)</p>`;
      html += `<p class="${isPlaceholder(l.clue_text) ? 'placeholder-line' : ''}" style="margin-bottom:6px;">${escapeHtml(l.clue_text)}</p>`;
      html += `<p class="${isPlaceholder(l.puzzle_question) ? 'placeholder-line' : ''}">${escapeHtml(l.puzzle_question)} ${l.puzzle_answer ? '(answer: ' + escapeHtml(l.puzzle_answer) + ')' : ''}</p>`;
      html += `</div>`;

      document.getElementById('app').innerHTML = html;
      document.getElementById('backBtn').disabled = current === 0;
      document.getElementById('nextBtn').disabled = current === landmarks.length - 1;
    }

    function goNext() { if (current < landmarks.length - 1) { current++; render(); window.scrollTo(0, 0); } }
    function goBack() { if (current > 0) { current--; render(); window.scrollTo(0, 0); } }

    function escapeHtml(str) { return String(str == null ? '' : str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
    function escapeAttr(str) { return escapeHtml(str).replace(/"/g, '&quot;'); }
  </script>
</body>
</html>
